name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create Release Please GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Falls back to GITHUB_TOKEN when no GitHub App is configured. Release
          # PRs created that way do not trigger CI; that is acceptable.
          token: ${{ steps.app-token.outputs.token || github.token }}

  packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml

  publish-release:
    needs: [release-please, packages]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
    steps:
      - name: Validate Release Please outputs
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_TAG" \
            | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$GITHUB_SHA" = "$RELEASE_SHA"

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify version files agree with the release
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < version.txt)" = "$RELEASE_VERSION"
          grep -Eq "^Version:[[:space:]]+${RELEASE_VERSION}\$" \
            packaging/rpm/purple-xmpp2.spec

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Create source tarball
        run: |
          set -euo pipefail
          git archive --format=tar.gz \
            --prefix="purple-xmpp2-${RELEASE_VERSION}/" \
            --output="dist/purple-xmpp2-${RELEASE_VERSION}.tar.gz" \
            "$RELEASE_SHA"
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist

      - name: Upload assets and publish the release
        run: |
          set -euo pipefail
          test "$(find dist -name '*.deb' | wc -l)" -ge 2
          test "$(find dist -name '*.rpm' | wc -l)" -ge 1
          gh release upload "$RELEASE_TAG" dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --repo "$GITHUB_REPOSITORY"

  publish-apt-repository:
    needs: [release-please, publish-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/apt-repository.yml
    secrets: inherit
